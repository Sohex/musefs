[package]
name = "musefs-fuse"
description = "FUSE adapter for musefs (fuser)."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
readme = "../README.md"
keywords = ["fuse", "filesystem", "music", "metadata", "audio"]
categories = ["filesystem", "multimedia::audio"]
# Integration tests stay in the repository: every one uses `musefs-db` or
# `musefs-format`'s `fuzzing` fixtures through path dev-dependencies, which
# cargo strips at publish, so they could not build from the published crate.
exclude = ["tests/"]

[features]
metrics = ["musefs-core/metrics"]
# Test-only: the background-session mount (`spawn`, `spawn_with`) the mount e2e
# tests drive, and the mount seams this crate's integration tests reach across
# the crate boundary, such as a forced worker-pool admission cap. Enabled by the
# self-dev-dependency below, so `cargo test` needs no flag; never part of the
# published API (#710). Mirrors musefs-core's `test-support`.
test-support = []

[dependencies]
# Pure-rust fusermount3 mount path; never enable `libfuse` (static musl can't link it).
fuser = { version = "0.18", default-features = false }
libc = "0.2"
log = "0.4"
rustix = { version = "1", features = ["process"] }
musefs-core = { path = "../musefs-core", version = "2.0.0" }
threadpool = "1"

[target.'cfg(target_os = "macos")'.dependencies]
fuser = { version = "0.18", features = ["macos-no-mount"] }

[dev-dependencies]
# Self-dependency: turns `test-support` on for this crate's own test builds.
musefs-fuse = { path = ".", features = ["test-support"] }
# `musefs-core`'s test scaffolding, compiled for tests only (#710):
# `CoreError::every_variant_for_test` for the errno mapping's coverage test, and
# the backing-read fault seam the `metrics`-gated fault-injection e2e sets.
musefs-core = { path = "../musefs-core", features = ["test-support"] }
tempfile = "3"
rustix = { version = "1", features = ["fs"] }
metaflac = "0.2"
musefs-db = { path = "../musefs-db" }
musefs-format = { path = "../musefs-format", features = ["fuzzing"] }
ogg = "0.9"
sha2 = "0.11"
memmap2 = "0.9"
base64 = "0.23"

[lints]
workspace = true
