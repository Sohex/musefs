[package]
name = "musefs-core"
description = "Orchestration for musefs: virtual tree, tag resolution, and scanning."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[features]
metrics = []
# Test-only: compiles the scaffolding this crate's own integration tests reach
# across the crate boundary — the whole-file oracle scan and the `Musefs`
# `*_for_test` hooks. Enabled by the self-dev-dependency below, so `cargo test`
# needs no flag; never part of the published API. Mirrors musefs-format's
# `fuzzing` feature.
test-support = []

[dependencies]
arc-swap = "1"
crossbeam-channel = "0.5"
dashmap = "6"
imbl = "7"
log = "0.4"
musefs-db = { path = "../musefs-db", version = "1.3.0" }
musefs-format = { path = "../musefs-format", version = "1.3.0" }
once_cell = "1"
parking_lot = "0.12"
quick_cache = { version = "0.7.0", features = ["stats"] }
base16ct = "1.0"
sha2 = "0.11"
sharded-slab = "0.1"
thiserror = "2"

[dev-dependencies]
musefs-latencyfs = { path = "../musefs-latencyfs" }
libc = "0.2"
tempfile = "3"
metaflac = "0.2"
id3 = "1"
criterion = "0.8"
proptest = "1"
rusqlite = { version = "0.40", features = ["bundled", "blob"] }
musefs-format = { path = "../musefs-format", features = ["fuzzing"] }
musefs-db = { path = "../musefs-db", features = ["test-support"] }
# Self-dependency: turns `test-support` on for this crate's own test builds.
musefs-core = { path = ".", features = ["test-support"] }
# `Format::iter()`, for the test standing in for the exhaustive format match
# that `#[non_exhaustive]` took away.
strum = "0.28"
ogg = "0.9"
crc = "3"
base64 = "0.23"

[[bench]]
name = "read_throughput"
harness = false

[[bench]]
name = "fingerprint_overhead"
harness = false

[lints]
workspace = true
