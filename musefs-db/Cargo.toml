[package]
name = "musefs-db"
description = "SQLite store and schema for musefs (tracks, tags, content-addressed art)."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
readme = "../README.md"
keywords = ["music", "metadata", "sqlite", "tags", "fuse"]
categories = ["database", "multimedia::audio"]
# Integration tests stay in the repository: they need this crate's
# `test-support` feature, which only a path dev-dependency turns on, and cargo
# strips path dev-dependencies at publish, so they could not build from the
# published crate.
exclude = ["tests/"]

[dependencies]
# HexDisplay is the RustCrypto-recommended way to hex-format a digest since
# sha2 0.11 swapped GenericArray (LowerHex) for hybrid_array::Array (no fmt).
base16ct = "1.0"
# fallible_uint enables the checked FromSql/ToSql impls for u64/usize, which
# validate non-negative row columns at the boundary (the cast-convention spec).
log = "0.4"
# limits: `Connection::set_limit`, which bounds every value a connection loads
# (`limits::MAX_ROW_BYTES`).
rusqlite = { version = "0.40", features = ["bundled", "blob", "fallible_uint", "limits"] }
sha2 = "0.11"
strum = { version = "0.28", features = ["derive"] }
thiserror = "2"

# A snapshot on a filesystem without hard links is named by a rename that refuses
# an existing file in the same step: rustix's `renameat_with` with
# `RenameFlags::NOREPLACE`, which exists on Linux and Apple platforms only.
[target.'cfg(any(target_os = "linux", target_os = "android", target_vendor = "apple"))'.dependencies]
rustix = { version = "1", features = ["fs"] }

[features]
# Test-only: gates `Default` impls (Db + model structs) so cargo-mutants'
# `Ok(Default::default())` mutants compile. Named after the activity that needs
# it, mirroring musefs-format's `fuzzing` feature. Not for production use.
mutants = []
# Test/fuzz-only: exposes `Db::with_raw_conn` so the out-of-workspace fuzz crate
# can plant hostile rows the validating public API cannot produce. Never enabled
# in normal builds. Mirrors the `mutants` feature pattern.
fuzzing = []
# Test-only: compiles the `Db` `*_for_test` hooks, which integration tests here
# and in musefs-core call across the crate boundary. Enabled by the
# self-dev-dependency below and by musefs-core's dev-dependency; never part of
# the published API.
test-support = []

[dev-dependencies]
# Used to plant a future `user_version` on a file-backed store, exercising the
# "store is newer than this binary" guard the public API cannot otherwise reach.
rusqlite = { version = "0.40", features = ["bundled"] }
tempfile = "3"
# Self-dependency: turns `test-support` on for this crate's own test builds.
musefs-db = { path = ".", features = ["test-support"] }

[lints]
workspace = true
