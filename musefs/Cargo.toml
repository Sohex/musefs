[package]
name = "musefs"
description = "Read-only FUSE filesystem presenting a re-tagged virtual view of a music library."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
readme = "../README.md"
keywords = ["fuse", "music", "metadata", "filesystem", "audio"]
categories = ["filesystem", "multimedia::audio", "command-line-utilities"]

[[bin]]
name = "musefs"
path = "src/main.rs"

[features]
default = ["jemalloc"]
jemalloc = ["dep:tikv-jemallocator", "dep:tikv-jemalloc-ctl", "tikv-jemalloc-ctl/stats", "dep:log", "dep:musefs-fuse"]

[dependencies]
env_logger = "0.11"
musefs-cli = { path = "../musefs-cli", version = "2.0.0" }
# Direct dep only under `jemalloc`: the binary installs the allocator-stats probe
# (`musefs_fuse::set_alloc_probe`) since it owns the jemalloc global allocator.
musefs-fuse = { path = "../musefs-fuse", version = "2.0.0", optional = true }
tikv-jemallocator = { version = "0.7", optional = true }
tikv-jemalloc-ctl = { version = "0.7", optional = true }
log = { version = "0.4", optional = true }

[dev-dependencies]
tempfile = "3"
# Reads the value-parser type of `musefs_cli::command()`'s flags, so the empty
# boolean variable test covers every boolean flag the command declares.
clap = "4"
# Writes the row an upgrade leaves owed a revalidate, which no command produces,
# for the process-level #705 warning test, and (`test-support`) seeds a store an
# older musefs left behind.
musefs-db = { path = "../musefs-db", features = ["test-support"] }
# Plants the rows an older musefs, or a writer with the constraints off, left in
# a store, for the process-level `migrate --repair` tests.
rusqlite = { version = "0.40", features = ["bundled"] }
rustix = { version = "1", features = ["process"] }

[lints]
workspace = true
